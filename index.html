<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>轉一轉・方位詞 Gira y ubica</title>
<style>
:root{--bg:#f7f5f0;--ink:#3b3a36;--sub:#8b877c;--line:#d8d4ca;--card:#fffdf8;--accent:#8a6f4d;--ok:#5f8a63;--bad:#b0605a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#app{max-width:480px;margin:0 auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:6px 0 2px;text-align:center;font-weight:600;letter-spacing:2px}
.sub{text-align:center;color:var(--sub);font-size:12px;margin-bottom:8px}
.bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.bar button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px}
.bar button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.score{text-align:center;font-size:14px;color:var(--sub);margin:4px 0 8px}
#board{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;aspect-ratio:1/1;width:100%}
.cell{background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px;position:relative;min-width:0}
.cell.empty{background:transparent;border:1px dashed var(--line)}
.cell .img{flex:1;min-height:0;width:78%;display:flex;align-items:center;justify-content:center;margin-top:12px}
.cell .img svg{width:100%;height:100%}
.cell.notext .img{margin-top:8px;margin-bottom:4px;width:84%}
.cell .n{font-size:14px;font-weight:600;margin-top:2px}
.cell .p{font-size:10px;color:var(--sub)}
.cell .h{position:absolute;top:3px;left:0;right:0;font-size:10px;color:var(--accent)}
.cell.target{outline:3px solid var(--accent)}
.center{background:transparent;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;border-radius:10px;grid-row:2;grid-column:2}
#char{width:78%;aspect-ratio:1/1;transition:transform 2s cubic-bezier(.2,.7,.2,1)}
#char.noanim{transition:none}
#spin{display:block;margin:14px auto 8px;font:inherit;font-size:17px;padding:10px 28px;border:none;border-radius:10px;background:var(--accent);color:#fff}
#spin:disabled{opacity:.4}
#qbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:130px;text-align:center}
.q{font-size:20px;font-weight:600}
.qp{font-size:12px;color:var(--sub);margin-top:2px}
.qe{font-size:12px;color:var(--sub);margin-top:2px;font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{font:inherit;font-size:15px;padding:10px 6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px}
.opt .op{display:block;font-size:10px;color:var(--sub)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.ok .op{color:#e8f0e8}
.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.bad .op{color:#f3e2e0}
.fb{margin-top:10px;font-size:15px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(59,58,54,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal[hidden]{display:none}
.mbox{background:var(--card);border-radius:14px;max-width:440px;width:100%;max-height:85vh;overflow:auto;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;font:inherit;font-size:14px;padding:6px;border:1px solid var(--line);background:var(--bg);border-radius:8px;color:var(--ink)}
.tabs button.on{background:var(--ink);color:var(--bg)}
.row{display:grid;grid-template-columns:1.2fr 1.2fr 1.6fr;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.row .nm{display:flex;align-items:center;gap:6px}
.row .ic{display:inline-block;width:30px;height:30px;flex:none}
.row .ic svg{width:100%;height:100%}
.row .py{color:var(--sub);font-size:12px}.row .es{font-size:12px}
.gr{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.gr .py{color:var(--sub);font-size:12px}.gr .es{font-size:12px;font-style:italic;color:var(--sub)}
.close{display:block;margin:12px auto 0;font:inherit;padding:8px 24px;border:1px solid var(--line);background:var(--bg);border-radius:8px;color:var(--ink)}
.big{font-size:40px;text-align:center;margin:8px 0}
</style>
</head>
<body>
<div id="app">
  <h1 id="title"></h1>
  <div class="sub">Gira y ubica · Direcciones relativas</div>
  <div class="bar">
    <button id="bMode"></button>
    <button id="bScript"></button>
    <button id="bText"></button>
    <button id="bPy"></button>
    <button id="bHint"></button>
    <button id="bDict"></button>
  </div>
  <div class="score" id="score"></div>
  <div id="board">
    <div class="cell" id="cell-7" data-s="7" style="grid-row:1;grid-column:1"></div>
    <div class="cell" id="cell-0" data-s="0" style="grid-row:1;grid-column:2"></div>
    <div class="cell" id="cell-1" data-s="1" style="grid-row:1;grid-column:3"></div>
    <div class="cell" id="cell-6" data-s="6" style="grid-row:2;grid-column:1"></div>
    <div class="center">
      <svg id="char" viewBox="0 0 100 100" data-facing="0" aria-label="character">
        <path d="M50 4 L63 24 L37 24 Z" fill="#8a6f4d"/>
        <circle cx="21" cy="50" r="7" fill="#fffdf8" stroke="#3b3a36" stroke-width="2"/>
        <circle cx="79" cy="50" r="7" fill="#fffdf8" stroke="#3b3a36" stroke-width="2"/>
        <circle cx="50" cy="54" r="27" fill="#e9e4d8" stroke="#3b3a36" stroke-width="2"/>
        <circle cx="50" cy="50" r="12" fill="#fffdf8" stroke="#3b3a36" stroke-width="2"/>
      </svg>
    </div>
    <div class="cell" id="cell-2" data-s="2" style="grid-row:2;grid-column:3"></div>
    <div class="cell" id="cell-5" data-s="5" style="grid-row:3;grid-column:1"></div>
    <div class="cell" id="cell-4" data-s="4" style="grid-row:3;grid-column:2"></div>
    <div class="cell" id="cell-3" data-s="3" style="grid-row:3;grid-column:3"></div>
  </div>
  <button id="spin"></button>
  <section id="qbox"></section>
</div>

<div class="modal" id="dict" hidden>
  <div class="mbox">
    <div class="tabs">
      <button id="tPlaces" data-tab="places"></button>
      <button id="tDirs" data-tab="dirs"></button>
      <button id="tGram" data-tab="gram"></button>
    </div>
    <div id="dbody"></div>
    <button class="close" id="dClose"></button>
  </div>
</div>

<div class="modal" id="end" hidden>
  <div class="mbox">
    <div class="big">🎉</div>
    <div class="q" id="endText" style="text-align:center"></div>
    <button class="close" id="again"></button>
  </div>
</div>

<script>
const S={
  title:['轉一轉・方位詞','转一转・方位词'],
  easy:['簡單 4 方位','简单 4 方位'],
  hard:['困難 8 方位','困难 8 方位'],
  script:['繁體','简体'],
  py:['拼音','拼音'],
  text:['文字','文字'],
  hint:['提示','提示'],
  dict:['小字典','小字典'],
  spin:['🔄 旋轉','🔄 旋转'],
  turning:['轉動中…','转动中…'],
  next:['再轉一次','再转一次'],
  result:['看結果','看结果'],
  intro:['按「旋轉」，角色會轉向。要用角色自己的方向來想！','按「旋转」，角色会转向。要用角色自己的方向来想！'],
  introEs:['Pulsa «Girar»: el personaje cambia de dirección. ¡Piensa desde SU punto de vista!','Pulsa «Girar»: el personaje cambia de dirección. ¡Piensa desde SU punto de vista!'],
  turningEs:['Girando…','Girando…'],
  where:['哪裡','哪里'],
  what:['什麼','什么'],
  ok:['答對了！','答对了！'],
  bad:['答錯了。正確：','答错了。正确：'],
  end:['完成！答對','完成！答对'],
  again:['再玩一次','再玩一次'],
  close:['關閉','关闭'],
  tPlaces:['地點','地点'],
  tDirs:['方位','方位'],
  tGram:['句型','句型'],
  qn:['題','题']
};
const PLACES=[
  {id:'cafe',zh:'咖啡廳',zs:'咖啡厅',py:'kāfēitīng',es:'la cafetería',esi:'una cafetería'},
  {id:'lib',zh:'圖書館',zs:'图书馆',py:'túshūguǎn',es:'la biblioteca',esi:'una biblioteca'},
  {id:'bank',zh:'銀行',zs:'银行',py:'yínháng',es:'el banco',esi:'un banco'},
  {id:'post',zh:'郵局',zs:'邮局',py:'yóujú',es:'la oficina de correos',esi:'una oficina de correos'},
  {id:'cvs',zh:'便利商店',zs:'便利商店',py:'biànlì shāngdiàn',es:'la tienda de conveniencia',esi:'una tienda de conveniencia'},
  {id:'hosp',zh:'醫院',zs:'医院',py:'yīyuàn',es:'el hospital',esi:'un hospital'},
  {id:'school',zh:'學校',zs:'学校',py:'xuéxiào',es:'la escuela',esi:'una escuela'},
  {id:'night',zh:'夜市',zs:'夜市',py:'yèshì',es:'el mercado nocturno',esi:'un mercado nocturno'},
  {id:'mrt',zh:'捷運站',zs:'捷运站',py:'jiéyùnzhàn',es:'la estación del metro',esi:'una estación de metro'},
  {id:'pharm',zh:'藥局',zs:'药局',py:'yàojú',es:'la farmacia',esi:'una farmacia'},
  {id:'park',zh:'公園',zs:'公园',py:'gōngyuán',es:'el parque',esi:'un parque'},
  {id:'mart',zh:'超市',zs:'超市',py:'chāoshì',es:'el supermercado',esi:'un supermercado'}
];
// 相對角色的方位，依順時針：0 前 → 7 左前
const DIRS=[
  {zh:'前面',zs:'前面',py:'qiánmiàn',es:'delante de mí'},
  {zh:'右前面',zs:'右前面',py:'yòu qiánmiàn',es:'delante a la derecha'},
  {zh:'右邊',zs:'右边',py:'yòubiān',es:'a la derecha'},
  {zh:'右後面',zs:'右后面',py:'yòu hòumiàn',es:'detrás a la derecha'},
  {zh:'後面',zs:'后面',py:'hòumiàn',es:'detrás de mí'},
  {zh:'左後面',zs:'左后面',py:'zuǒ hòumiàn',es:'detrás a la izquierda'},
  {zh:'左邊',zs:'左边',py:'zuǒbiān',es:'a la izquierda'},
  {zh:'左前面',zs:'左前面',py:'zuǒ qiánmiàn',es:'delante a la izquierda'}
];

const cB='#e9e4d8',cT='#cdbfa6',cG='#b9c4b0',cW='#fffdf8',cR='#c98a84',cBL='#c3cfd6',GR='<path d="M4 56H60"/>';
const svg=x=>'<svg viewBox="0 0 64 64" fill="none" stroke="#3b3a36" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">'+x+'</svg>';
const ICON={
cafe:svg(GR+`<rect x="10" y="26" width="44" height="30" fill="${cB}"/><path d="M7 26L12 12H52L57 26Z" fill="${cT}"/><rect x="14" y="33" width="20" height="14" fill="${cW}"/><path d="M19 37h10v5a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4z" fill="${cT}"/><path d="M29 38h2a2.5 2.5 0 0 1 0 5h-2"/><rect x="39" y="34" width="10" height="22" fill="${cT}"/>`),
lib:svg(GR+`<rect x="8" y="26" width="48" height="30" fill="${cB}"/><path d="M5 26L32 8L59 26Z" fill="${cT}"/><path d="M32 36c-4-3-9-3-14-2v14c5-1 10-1 14 2 4-3 9-3 14-2V34c-5-1-10-1-14 2z" fill="${cW}"/><path d="M32 36v14"/>`),
bank:svg(GR+`<path d="M6 24L32 8L58 24Z" fill="${cT}"/><circle cx="32" cy="18" r="4" fill="${cW}"/><rect x="8" y="24" width="48" height="3" fill="${cB}"/><rect x="12" y="27" width="7" height="23" fill="${cW}"/><rect x="23" y="27" width="7" height="23" fill="${cW}"/><rect x="34" y="27" width="7" height="23" fill="${cW}"/><rect x="45" y="27" width="7" height="23" fill="${cW}"/><rect x="7" y="50" width="50" height="6" fill="${cB}"/>`),
post:svg(GR+`<rect x="8" y="16" width="48" height="34" rx="2" fill="${cG}"/><path d="M8 18L32 36L56 18"/>`),
cvs:svg(GR+`<rect x="8" y="22" width="48" height="34" fill="${cB}"/><rect x="8" y="12" width="48" height="10" fill="${cW}"/><path d="M8 15H56" stroke="#8a6f4d"/><path d="M8 19H56" stroke="${cG}"/><rect x="11" y="30" width="8" height="12" fill="${cW}"/><rect x="45" y="30" width="8" height="12" fill="${cW}"/><rect x="22" y="32" width="20" height="24" fill="${cW}"/><path d="M32 32v24"/>`),
hosp:svg(GR+`<rect x="10" y="14" width="44" height="42" fill="${cB}"/><rect x="26" y="18" width="12" height="12" fill="${cR}"/><path d="M32 20v8M28 24h8" stroke="${cW}" stroke-width="3"/><rect x="14" y="36" width="8" height="7" fill="${cW}"/><rect x="42" y="36" width="8" height="7" fill="${cW}"/><rect x="27" y="42" width="10" height="14" fill="${cW}"/>`),
school:svg(GR+`<rect x="6" y="32" width="52" height="24" fill="${cB}"/><rect x="22" y="18" width="20" height="38" fill="${cT}"/><path d="M20 18L32 10L44 18Z" fill="${cB}"/><circle cx="32" cy="25" r="4" fill="${cW}"/><path d="M32 22v3l2 1"/><path d="M32 10V3"/><path d="M32 3h8v5h-8" fill="${cR}"/><rect x="10" y="38" width="8" height="8" fill="${cW}"/><rect x="46" y="38" width="8" height="8" fill="${cW}"/><rect x="28" y="42" width="8" height="14" fill="${cW}"/>`),
night:svg(GR+`<rect x="10" y="40" width="44" height="16" fill="${cT}"/><path d="M12 40V22M52 40V22"/><path d="M8 22L12 12H52L56 22Z" fill="${cB}"/><path d="M24 12L22 22M32 12V22M40 12L42 22"/><path d="M20 22v4M44 22v4"/><ellipse cx="20" cy="31" rx="5" ry="6" fill="${cR}"/><ellipse cx="44" cy="31" rx="5" ry="6" fill="${cR}"/><path d="M26 40a6 5 0 0 1 12 0z" fill="${cW}"/>`),
mrt:svg(GR+`<rect x="14" y="8" width="36" height="40" rx="8" fill="${cBL}"/><rect x="19" y="14" width="26" height="16" rx="3" fill="${cW}"/><path d="M32 14v16"/><circle cx="22" cy="39" r="3" fill="${cW}"/><circle cx="42" cy="39" r="3" fill="${cW}"/><path d="M20 48l-6 8M44 48l6 8M26 52h12"/>`),
pharm:svg(GR+`<rect x="8" y="24" width="48" height="32" fill="${cB}"/><rect x="8" y="14" width="48" height="10" fill="${cG}"/><path d="M32 16v6M29 19h6" stroke="${cW}" stroke-width="2.5"/><rect x="12" y="32" width="24" height="16" fill="${cW}"/><g transform="rotate(-30 24 40)"><rect x="16" y="36" width="16" height="8" rx="4" fill="${cT}"/><path d="M24 36v8"/></g><rect x="42" y="32" width="10" height="24" fill="${cT}"/>`),
park:svg(GR+`<rect x="14" y="36" width="5" height="20" fill="${cT}"/><circle cx="16.5" cy="26" r="12" fill="${cG}"/><rect x="44" y="40" width="4" height="16" fill="${cT}"/><circle cx="46" cy="32" r="9" fill="${cG}"/><path d="M26 46h14M26 50h14M28 50v6M38 50v6"/>`),
mart:svg(GR+`<path d="M16 20H56L50 40H22Z" fill="${cB}"/><path d="M6 12H13L22 40"/><path d="M28 20L30 40M38 20V40M48 20L46 40"/><circle cx="26" cy="48" r="4" fill="${cT}"/><circle cx="46" cy="48" r="4" fill="${cT}"/><rect x="24" y="10" width="10" height="10" fill="${cG}"/><circle cx="44" cy="15" r="5" fill="${cR}"/>`)
};
const ROUNDS=10;
const st={script:'t',py:false,text:true,hint:false,mode:'easy',cells:[],facing:0,angle:0,q:null,answered:false,n:0,score:0,spinning:false,dtab:'places'};
try{const s=JSON.parse(localStorage.getItem('fangwei')||'{}');if(s.script)st.script=s.script;st.py=!!s.py;if(s.text===false)st.text=false;st.hint=!!s.hint;if(s.mode)st.mode=s.mode;}catch(e){}
function save(){try{localStorage.setItem('fangwei',JSON.stringify({script:st.script,py:st.py,text:st.text,hint:st.hint,mode:st.mode}))}catch(e){}}

const $=s=>document.querySelector(s);
const T=a=>a[st.script==='t'?0:1];
const pn=p=>st.script==='t'?p.zh:p.zs;
const dn=d=>st.script==='t'?d.zh:d.zs;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const evenOnly=()=>st.mode==='easy';
const allowedCells=()=>evenOnly()?[0,2,4,6]:[0,1,2,3,4,5,6,7];

function newGame(){
  st.n=0;st.score=0;st.q=null;st.answered=false;st.spinning=false;st.facing=0;st.angle=0;
  const ch=$('#char');ch.classList.add('noanim');ch.style.transform='rotate(0deg)';ch.dataset.facing='0';
  void ch.offsetWidth;ch.classList.remove('noanim');
  const ids=allowedCells();const ps=shuffle(PLACES).slice(0,ids.length);
  st.cells=Array(8).fill(null);ids.forEach((c,i)=>st.cells[c]=ps[i]);
  $('#end').hidden=true;
  update();
}

function spin(){
  if(st.spinning||(st.q&&!st.answered))return;
  const f=pick(allowedCells());
  const delta=((f-st.facing+8)%8)*45;
  st.angle+=720+delta;st.facing=f;st.q=null;st.answered=false;st.spinning=true;
  const ch=$('#char');ch.style.transform='rotate('+st.angle+'deg)';ch.dataset.facing=String(f);
  update();
  setTimeout(()=>{st.spinning=false;makeQuestion();update();},2100);
}

function makeQuestion(){
  const filled=[];st.cells.forEach((p,i)=>{if(p)filled.push(i)});
  const s=pick(filled),place=st.cells[s],rel=(s-st.facing+8)%8;
  const type=Math.random()<.5?'zai':'you';
  let options;
  if(type==='zai'){
    const pool=allowedCells().map(c=>c); // 相對方位集合與地點格相同
    const others=shuffle(pool.filter(r=>r!==rel)).slice(0,3);
    options=shuffle([rel,...others]).map(r=>({val:r,ok:r===rel}));
  }else{
    const others=shuffle(filled.filter(c=>c!==s)).slice(0,3).map(c=>st.cells[c]);
    options=shuffle([place,...others]).map(p=>({val:p.id,ok:p.id===place.id}));
  }
  st.q={type,cell:s,place,rel,options};st.answered=false;
}

function answer(i){
  if(!st.q||st.answered)return;
  st.answered=true;st.n++;
  if(st.q.options[i].ok)st.score++;
  st.q.picked=i;update();
}

function optLabel(o){
  if(st.q.type==='zai'){const d=DIRS[o.val];return {t:'在我的'+dn(d),p:'zài wǒ de '+d.py};}
  const p=PLACES.find(x=>x.id===o.val);return {t:'有'+pn(p),p:'yǒu '+p.py};
}
function fullSentence(q){
  const d=DIRS[q.rel],p=q.place;
  if(q.type==='zai')return {t:pn(p)+'在我的'+dn(d)+'。',p:p.py+' zài wǒ de '+d.py,e:'Está '+d.es.replace('delante de mí','delante de mí')+'.'};
  return {t:'我的'+dn(d)+'有'+pn(p)+'。',p:'wǒ de '+d.py+' yǒu '+p.py,e:'Hay '+p.esi+' '+d.es+'.'};
}

function update(){
  $('#title').textContent=T(S.title);
  $('#bMode').textContent=st.mode==='easy'?T(S.easy):T(S.hard);
  $('#bScript').textContent=T(S.script);
  $('#bText').textContent=T(S.text);$('#bText').classList.toggle('on',st.text);
  $('#bPy').textContent=T(S.py);$('#bPy').classList.toggle('on',st.py);
  $('#bHint').textContent=T(S.hint);$('#bHint').classList.toggle('on',st.hint);
  $('#bDict').textContent=T(S.dict);
  $('#score').textContent=st.n+' / '+ROUNDS+' '+T(S.qn)+'　✓ '+st.score;
  // 格子
  for(let s=0;s<8;s++){
    const el=$('#cell-'+s),p=st.cells[s];
    el.dataset.cell=s;
    if(!p){el.className='cell empty';el.innerHTML='';continue;}
    el.className='cell'+(st.text?'':' notext')+(st.answered&&st.q&&st.q.cell===s?' target':'');
    const rel=(s-st.facing+8)%8;
    el.innerHTML=(st.hint&&!st.spinning?'<div class="h">'+dn(DIRS[rel])+'</div>':'')+
      '<div class="img" role="img" aria-label="'+pn(p)+'">'+ICON[p.id]+'</div>'+(st.text?'<div class="n">'+pn(p)+'</div>'+(st.py?'<div class="p">'+p.py+'</div>':''):'');
    el.dataset.name=pn(p);
    el.dataset.place=p.id;
  }
  // 旋轉鈕
  const sp=$('#spin');
  if(st.q&&st.answered)sp.textContent=st.n>=ROUNDS?T(S.result):T(S.next);else sp.textContent=T(S.spin);
  sp.disabled=st.spinning||!!(st.q&&!st.answered);
  // 題目區
  const qb=$('#qbox');
  if(st.spinning){qb.innerHTML='<div class="q">'+T(S.turning)+'</div><div class="qe">'+T(S.turningEs)+'</div>';return}
  if(!st.q){qb.innerHTML='<div class="q" style="font-size:16px">'+T(S.intro)+'</div><div class="qe">'+T(S.introEs)+'</div>';return}
  const q=st.q;let qt,qp,qe;
  if(q.type==='zai'){
    qt=pn(q.place)+'在'+T(S.where)+'？';qp=q.place.py+' zài nǎlǐ?';qe='¿Dónde está '+q.place.es+'?';
  }else{
    qt='我的'+dn(DIRS[q.rel])+'有'+T(S.what)+'？';qp='wǒ de '+DIRS[q.rel].py+' yǒu shénme?';qe='¿Qué hay '+DIRS[q.rel].es+'?';
  }
  let h='<div class="q">'+qt+'</div>'+(st.py?'<div class="qp">'+qp+'</div>':'')+'<div class="qe">'+qe+'</div><div class="opts">';
  q.options.forEach((o,i)=>{
    const l=optLabel(o);let cls='opt';
    if(st.answered){if(o.ok)cls+=' ok';else if(q.picked===i)cls+=' bad';}
    h+='<button class="'+cls+'" data-i="'+i+'" data-correct="'+(o.ok?1:0)+'"'+(st.answered?' disabled':'')+'>'+l.t+(st.py?'<span class="op">'+l.p+'</span>':'')+'</button>';
  });
  h+='</div>';
  if(st.answered){
    const good=q.options[q.picked].ok,fs=fullSentence(q);
    h+='<div class="fb '+(good?'ok':'bad')+'" id="fb">'+(good?T(S.ok):T(S.bad))+'<br>'+fs.t+(st.py?'<div class="qp">'+fs.p+'</div>':'')+'<div class="qe">'+fs.e+'</div></div>';
  }
  qb.innerHTML=h;
  qb.dataset.type=q.type;qb.dataset.cell=q.cell;qb.dataset.rel=q.rel;
}

function renderDict(){
  $('#tPlaces').textContent=T(S.tPlaces);$('#tDirs').textContent=T(S.tDirs);$('#tGram').textContent=T(S.tGram);$('#dClose').textContent=T(S.close);
  ['places','dirs','gram'].forEach(k=>{const b=document.querySelector('[data-tab="'+k+'"]');b.classList.toggle('on',st.dtab===k)});
  let h='';
  if(st.dtab==='places')PLACES.forEach(p=>{h+='<div class="row"><span class="nm"><i class="ic" data-icon="'+p.id+'">'+ICON[p.id]+'</i>'+pn(p)+'</span><span class="py">'+p.py+'</span><span class="es">'+p.es+'</span></div>'});
  else if(st.dtab==='dirs')DIRS.forEach(d=>{h+='<div class="row"><span>'+dn(d)+'</span><span class="py">'+d.py+'</span><span class="es">'+d.es+'</span></div>'});
  else{
    const p=PLACES[0],d=DIRS[6];
    h+='<div class="gr"><b>在 zài</b>　estar (ubicación)<br>'+pn(p)+'在我的'+dn(d)+'。<div class="py">'+p.py+' zài wǒ de '+d.py+'</div><div class="es">'+p.es.charAt(0).toUpperCase()+p.es.slice(1)+' está '+d.es+'.</div></div>';
    h+='<div class="gr"><b>有 yǒu</b>　haber / existir<br>我的'+dn(d)+'有'+pn(p)+'。<div class="py">wǒ de '+d.py+' yǒu '+p.py+'</div><div class="es">'+d.es.charAt(0).toUpperCase()+d.es.slice(1)+' hay '+p.esi+'.</div></div>';
    h+='<div class="gr"><b>'+T(['前、後、左、右','前、后、左、右'])+'</b><br>'+T(['要用角色自己的方向來想。','要用角色自己的方向来想。'])+'<div class="es">Siempre desde el punto de vista del personaje.</div></div>';
  }
  $('#dbody').innerHTML=h;
}

// 事件
$('#spin').onclick=()=>{if(st.q&&st.answered&&st.n>=ROUNDS){showEnd();return}spin()};
$('#qbox').onclick=e=>{const b=e.target.closest('.opt');if(b)answer(+b.dataset.i)};
$('#bMode').onclick=()=>{st.mode=st.mode==='easy'?'hard':'easy';save();newGame()};
$('#bScript').onclick=()=>{st.script=st.script==='t'?'s':'t';save();update();renderDict()};
$('#bText').onclick=()=>{st.text=!st.text;save();update()};
$('#bPy').onclick=()=>{st.py=!st.py;save();update()};
$('#bHint').onclick=()=>{st.hint=!st.hint;save();update()};
$('#bDict').onclick=()=>{renderDict();$('#dict').hidden=false};
$('#dClose').onclick=()=>{$('#dict').hidden=true};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{st.dtab=b.dataset.tab;renderDict()});
function showEnd(){$('#endText').textContent=T(S.end)+' '+st.score+' / '+ROUNDS;$('#again').textContent=T(S.again);$('#end').hidden=false}
$('#again').onclick=newGame;
newGame();
</script>
</body>
</html>
